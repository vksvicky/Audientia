          echo "$next_build" >> "$MODULE_BUILD_NUM_FILE"
          
          version=$(printf "%04d.%02d.%04d" "$YEAR" "$MONTH" "$next_build")
          full_version="${MODULE_NAME}-${version}"
          echo "Updating ${MODULE_NAME} version to: $full_version"
