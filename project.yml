name: Audientia
options:
  bundleIdPrefix: club.cycleruncode
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
  groupSortPosition: top
  settings:
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS_EXTENSIONS: YES
    STRINGCATALOG_GENERATE_SWIFT_CODE: YES

fileGroups:
  - group: Sources
    excludes:
      - "**/README.md"
  - group: Tests
    excludes:
      - "**/README.md"
  - group: Resources
    path: Resources
    createIntermediateGroups: true
    excludes:
      - "**/README.md"
  - group: Documentation
    path: Documentation
    createIntermediateGroups: true
  - group: Scripts
    path: Scripts
    createIntermediateGroups: true
  - group: Configuration
    path: Configuration
    createIntermediateGroups: true
  - README.md

targets:
  Audientia:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/UI
        group: Sources
        excludes:
          - "**/README.md"
    dependencies:
      - target: Shared
      - target: AppKitBridge
      - target: AudioCore
      - target: MetadataEngine
      - target: DataLayer
      - target: PluginSystem
    resources:
      # Assets.xcassets - asset catalog for app icon and images
      # Note: This should automatically create a Resources build phase
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS_EXTENSIONS: YES
      INFOPLIST_FILE: Configuration/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: club.cycleruncode.audientia
      MARKETING_VERSION: "2025.11.0032"
      CURRENT_PROJECT_VERSION: "32"
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      SUPPORTED_PLATFORMS: macosx
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: false
      ENABLE_APP_SANDBOX: false
      DEAD_CODE_STRIPPING: YES
      EXECUTABLE_NAME: $(PRODUCT_NAME)
    preBuildScripts:
      - name: Update App Version
        script: |
          set -e
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          # Use temp directory to avoid sandbox issues
          VERSION_DIR="${TARGET_TEMP_DIR}/versions"
          mkdir -p "$VERSION_DIR"
          BUILD_NUM_FILE="${VERSION_DIR}/.build_number"
          PROJECT_ROOT="${SRCROOT}"
          PROJECT_YML="${PROJECT_ROOT}/project.yml"

          # Get next build number
          current_build=0
          if [ -f "$BUILD_NUM_FILE" ]; then
              stored_date=$(head -n 1 "$BUILD_NUM_FILE" 2>/dev/null || echo "")
              stored_build=$(tail -n 1 "$BUILD_NUM_FILE" 2>/dev/null || echo "0")
              if [ "$stored_date" = "$YEAR.$MONTH" ]; then
                  current_build=$stored_build
              fi
          fi

          next_build=$((current_build + 1))
          echo "$YEAR.$MONTH" > "$BUILD_NUM_FILE"
          echo "$next_build" >> "$BUILD_NUM_FILE"

          version=$(printf "%04d.%02d.%04d" "$YEAR" "$MONTH" "$next_build")
          echo "Updating app version to: $version"
          echo "$version" > "${VERSION_DIR}/.app_version"
          # Also copy to app bundle Contents directory for runtime access
          # BUILT_PRODUCTS_DIR points to the .app bundle during build
          APP_BUNDLE="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
          if [ -d "${APP_BUNDLE}" ]; then
              mkdir -p "${APP_BUNDLE}/Contents"
              cp "${VERSION_DIR}/.app_version" "${APP_BUNDLE}/Contents/.app_version" 2>/dev/null || true
              echo "Copied .app_version to ${APP_BUNDLE}/Contents/.app_version"
          elif [ -d "${BUILT_PRODUCTS_DIR}" ] && [[ "${BUILT_PRODUCTS_DIR}" == *.app ]]; then
              # BUILT_PRODUCTS_DIR is already the .app bundle
              mkdir -p "${BUILT_PRODUCTS_DIR}/Contents"
              cp "${VERSION_DIR}/.app_version" "${BUILT_PRODUCTS_DIR}/Contents/.app_version" 2>/dev/null || true
              echo "Copied .app_version to ${BUILT_PRODUCTS_DIR}/Contents/.app_version"
          else
              # Fallback: copy to build directory
              cp "${VERSION_DIR}/.app_version" "${TARGET_BUILD_DIR}/.app_version" 2>/dev/null || true
              echo "Copied .app_version to ${TARGET_BUILD_DIR}/.app_version"
          fi

          # Update project.yml with new version only if AUTO_UPDATE_VERSION is set to "YES"
          # This prevents unwanted version updates during development
          if [ "${AUTO_UPDATE_VERSION:-NO}" = "YES" ] && [ -f "$PROJECT_YML" ]; then
              # Update MARKETING_VERSION
              sed -i '' "s/^      MARKETING_VERSION: \".*\"/      MARKETING_VERSION: \"$version\"/" "$PROJECT_YML"
              # Update CURRENT_PROJECT_VERSION (use build number)
              sed -i '' "s/^      CURRENT_PROJECT_VERSION: \".*\"/      CURRENT_PROJECT_VERSION: \"$next_build\"/" "$PROJECT_YML"
              echo "Updated project.yml: MARKETING_VERSION=$version, CURRENT_PROJECT_VERSION=$next_build"
          else
              echo "Version calculated: $version (build $next_build) - not updating project.yml (set AUTO_UPDATE_VERSION=YES to enable)"
          fi
        shellPath: /bin/bash
        basedOnDependencyAnalysis: false
    # Note: load_versions.swift script disabled to prevent overwriting AutoVersionUpdate.swift
    # Version updates are handled by updateAppVersionFromBuild() and scanAndRegisterModules()
    info:
      path: Configuration/Info.plist
      properties:
        CFBundleName: Audientia
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2025 CycleRunCode Club. All rights reserved."
        NSAppSupportEmail: support@cycleruncode.club
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true

