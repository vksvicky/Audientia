      BUNDLE_LOADER: "$(TEST_HOST)"
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      DEAD_CODE_STRIPPING: YES

schemes:
  Audientia:
    build:
      targets:
        Audientia: all
