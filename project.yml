          cp "${VERSION_DIR}/.${MODULE_NAME}_version" "${BUILT_PRODUCTS_DIR}/.${MODULE_NAME}_version" 2>/dev/null || true
        shellPath: /bin/bash
        basedOnDependencyAnalysis: false
    # Note: Framework renaming removed to avoid build issues
    # Version is tracked in version files for ModuleVersionManager

