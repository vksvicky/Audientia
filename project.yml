name: Audientia
options:
  bundleIdPrefix: club.cycleruncode
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
  settings:
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS_EXTENSIONS: YES
    STRINGCATALOG_GENERATE_SWIFT_CODE: YES

targets:
  Audientia:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: UI
    dependencies:
      - target: Shared
      - target: AppKitBridge
      - target: AudioCore
      - target: MetadataEngine
      - target: DataLayer
      - target: PluginSystem
    resources:
      - path: brand
      - path: Audientia.iconset
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: club.cycleruncode.audientia
      MARKETING_VERSION: "2025.01.0001"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      SUPPORTED_PLATFORMS: macosx
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: false
      ENABLE_APP_SANDBOX: false
      DEAD_CODE_STRIPPING: YES
    preBuildScripts:
      - name: Update App Version
        script: |
          set -e
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          # Use temp directory to avoid sandbox issues
          VERSION_DIR="${TARGET_TEMP_DIR}/versions"
          mkdir -p "$VERSION_DIR"
          BUILD_NUM_FILE="${VERSION_DIR}/.build_number"
          
          # Get next build number
          current_build=0
          if [ -f "$BUILD_NUM_FILE" ]; then
              stored_date=$(head -n 1 "$BUILD_NUM_FILE" 2>/dev/null || echo "")
              stored_build=$(tail -n 1 "$BUILD_NUM_FILE" 2>/dev/null || echo "0")
              if [ "$stored_date" = "$YEAR.$MONTH" ]; then
                  current_build=$stored_build
              fi
          fi
          
          next_build=$((current_build + 1))
          echo "$YEAR.$MONTH" > "$BUILD_NUM_FILE"
          echo "$next_build" >> "$BUILD_NUM_FILE"
          
          version=$(printf "%04d.%02d.%04d" "$YEAR" "$MONTH" "$next_build")
          echo "Updating app version to: $version"
          echo "$version" > "${VERSION_DIR}/.app_version"
          # Also copy to build products for runtime access
          cp "${VERSION_DIR}/.app_version" "${BUILT_PRODUCTS_DIR}/.app_version" 2>/dev/null || true
        shellPath: /bin/bash
        basedOnDependencyAnalysis: false
    # Note: load_versions.swift script disabled to prevent overwriting AutoVersionUpdate.swift
    # Version updates are handled by updateAppVersionFromBuild() and scanAndRegisterModules()
    info:
      path: Info.plist
      properties:
        CFBundleName: Audientia
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleIconFile: Audientia
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2025 CycleRunCode Club. All rights reserved."
        NSAppSupportEmail: support@cycleruncode.club
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true

  AppKitBridge:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: AppKitBridge
    dependencies:
      - target: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: club.cycleruncode.AppKitBridge
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      GENERATE_INFOPLIST_FILE: YES
