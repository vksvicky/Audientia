new version only if AUTO_UPDATE_VERSION is set to \"YES\"\n# This prevents unwanted version updates during development\nif [ \"${AUTO_UPDATE_VERSION:-NO}\" = \"YES\" ] && [ -f \"$PROJECT_YML\" ]; then\n    # Update MARKETING_VERSION\n    sed -i '' \"s/^      MARKETING_VERSION: \\\".*\\\"/      MARKETING_VERSION: \\\"$version\\\"/\" \"$PROJECT_YML\"\n    # Update CURRENT_PROJECT_VERSION (use build number)\n    sed -i '' \"s/^      CURRENT_PROJECT_VERSION: \\\".*\\\"/      CURRENT_PROJECT_VERSION: \\\"$next_build\\\"/\" \"$PROJECT_YML\"\n    echo \"Updated project.yml: MARKETING_VERSION=$version, CURRENT_PROJECT_VERSION=$next_build\"\nelse\n    echo \"Version calculated: $version (build $next_build) - not updating project.yml (set AUTO_UPDATE_VERSION=YES to enable)\"\nfi\n";
